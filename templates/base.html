<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FightZone</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet">
</head>

<body id="site-body" class="fade-transition">
    {% if request.endpoint not in ['login', 'register'] %}
    <!-- Navbar for Logged-In Pages -->
    <header class="top-banner">
        <div class="logo-box">
            <a href="{{ url_for('home') }}" class="logo-text"> FightZone </a>
        </div>
        <nav class="nav-links">
    <a href="{{ url_for('about') }}" class="nav-btn">About</a>
    <a href="{{ url_for('benefits') }}" class="nav-btn">Benefits</a>
    <a href="{{ url_for('membership') }}" class="nav-btn">Membership</a>
    <a href="{{ url_for('store') }}" class="nav-btn">Store</a>

    <div class="settings-dropdown">
        <button type="button" class="nav-btn settings-btn" id="settingsToggle">⚙️</button>
        <div class="settings-menu" id="settingsMenu">
            <a href="{{ url_for('my_account') }}" class="settings-item my-account-link">My Account</a>
            <a href="{{ url_for('logout') }}" class="settings-item logout-item">Logout</a>
        </div>
        </div>
        </nav>
    </header>
    {% endif %}

    <!-- Page Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 FightZone Gym — All rights reserved. | Founder: Cynrics</p>
    </footer>

<script>
(function(){
    const body = document.getElementById("site-body");

    // Only logged-in pages should fade
    const isLoggedIn = {{ 'true' if session.get('user_id') else 'false' }};

    // Allowed pages for transitions
    const allowedRoutes = ["/home", "/about", "/benefits", "/membership", "/store", "/my_account"];

    function isAllowed(url) {
        try {
            const u = new URL(url, window.location.href);
            return allowedRoutes.includes(u.pathname);
        } catch {
            return false;
        }
    }

    if (!isLoggedIn) return;

    // Intercept link clicks for fade effect
    document.addEventListener("click", function(e){
        if (e.defaultPrevented) return;
        if (e.button !== 0) return;
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

        let a = e.target;
        while (a && a.tagName !== "A") a = a.parentElement;
        if (!a || !a.href) return;
        if (!isAllowed(a.href)) return;

        e.preventDefault();

        // Add glow for My Account link if clicked
        if (a.classList.contains("my-account-link")) {
            a.classList.add("clicked");
            setTimeout(() => {
                body.classList.add("fade-out");
                setTimeout(() => { window.location.href = a.href; }, 350);
            }, 200); // short delay to show glow
        } else {
            body.classList.add("fade-out");
            setTimeout(() => { window.location.href = a.href; }, 350);
        }
    });

})();

/* SETTINGS DROPDOWN TOGGLE */
(function(){
    const toggle = document.getElementById("settingsToggle");
    const menu = document.getElementById("settingsMenu");
    if (!toggle || !menu) return;

    toggle.addEventListener("click", function(e){
        e.stopPropagation();
        menu.classList.toggle("open");
    });

    document.addEventListener("click", function(e){
        if (!menu.contains(e.target) && e.target !== toggle) {
            menu.classList.remove("open");
        }
    });
})();
</script>

<style>
/* Fade transition */
#site-body.fade-transition {
  opacity: 1;
  transition: opacity 350ms ease-in-out;
}
#site-body.fade-out {
  opacity: 0 !important;
}

/* Navbar buttons */
.nav-btn {
    padding: 8px 16px;
    border-radius: 6px;
    text-decoration: none;
    color: white;
    transition: all 0.3s ease;
}

/* Dynamic red glow for My Account link when clicked */
.my-account-link.clicked {
    animation: pulse-red 1.5s infinite alternate;
}

@keyframes pulse-red {
    0% { box-shadow: 0 0 5px #ff0000, 0 0 10px #ff4d4d, 0 0 15px #ff6666; }
    50% { box-shadow: 0 0 10px #ff0000, 0 0 20px #ff4d4d, 0 0 30px #ff6666; }
    100% { box-shadow: 0 0 5px #ff0000, 0 0 10px #ff4d4d, 0 0 15px #ff6666; }
}

/* SETTINGS DROPDOWN */
.settings-dropdown {
    position: relative;
    display: inline-block;
    margin-left: 15px;
}

.settings-btn {
    margin-left: 5px;
    padding: 8px 14px;
    background: #0d0d0d;
    border: 2px solid #ff0000;
    box-shadow: 0 0 10px rgba(255, 0, 0, 0.5), inset 0 0 8px rgba(255, 0, 0, 0.4);
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s ease;
}

.settings-btn:hover {
    background: #ff0000;
    transform: scale(1.08);
    box-shadow: 0 0 20px red;
}

.settings-menu {
    display: none;
    position: absolute;
    top: calc(100% + 30px);
    right: 0;
    background: #0d0d0d;
    border: 2px solid #ff0000;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.6), inset 0 0 10px rgba(255, 0, 0, 0.4);
    min-width: 180px;
    text-align: center;
    overflow: hidden;
    z-index: 1500;
    animation: dropIn 0.2s ease-out;
}

.settings-menu.open {
    display: block;
}

.settings-item {
    display: block;
    padding: 12px 18px;
    color: white;
    text-decoration: none;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid rgba(255, 0, 0, 0.3);
    transition: 0.2s ease;
    text-align: center;
}

.settings-item:last-child {
    border-bottom: none;
}

.settings-item:hover {
    background: #ff0000;
    color: black;
}

.logout-item {
    color: #ff6666;
}

.logout-item:hover {
    background: #ff0000;
    color: white;
}

@keyframes dropIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>

</body>
</html>
